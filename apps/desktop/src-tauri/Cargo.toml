[package]
name = "silksong-git"
version = "0.1.0"
description = "Hardened desktop shell for Silksong Git"
edition = "2024"
default-run = "silksong-git"

[lib]
name = "silksong_git_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "runtime_layout_fixture"
path = "src/bin/runtime_layout_fixture.rs"
test = false

[features]
default = ["runtime-system"]
runtime-system = []
runtime-bundled = []

[build-dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
chrono = { version = "=0.4.45", features = ["clock"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = "=2.4.3"
which = "=8.0.5"

[dev-dependencies]
tauri = { version = "=2.11.5", features = ["test"] }
